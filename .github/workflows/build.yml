name: Build APK

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force build"
        required: false
        default: "true"
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - "catvod/**"
      - "quickjs/**"
      - "chaquo/**"
      - "buildSrc/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fongmi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python 3.10 (chaquo requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          test -f keystore.jks

      - name: Prepare local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          storeFile=${GITHUB_WORKSPACE}/keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease :app:assembleMobileRelease --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-apks
          path: |
            app/build/outputs/apk/**/release/*.apk
            Release/apk/*.apk
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks local.properties
